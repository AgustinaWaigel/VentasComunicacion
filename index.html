<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/comunicacion.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="Sistema de e-commerce y gestión de pedidos con notificaciones en tiempo real" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ventas" />
    <title>Ventas Comunicación</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registrar Service Worker para PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registrado:', registration);
            })
            .catch((error) => {
              console.log('Error registrando Service Worker:', error);
            });
        });
      }

      // Detectar instalación de PWA
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        console.log('PWA puede ser instalada');
      });

      window.addEventListener('appinstalled', () => {
        console.log('PWA instalada');
      });
    </script>
  </body>
</html>
